<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:"Segoe UI", system-ui, sans-serif; background:#0f0f0f; color:#f1f1f1; }
  header { display:flex; align-items:center; gap:10px; padding:12px 20px;
    background:#0f0f0f; border-bottom:1px solid #272727; position:sticky; top:0; }
  .logo { display:flex; align-items:center; gap:8px; font-size:20px; font-weight:700; letter-spacing:-.5px; }
  .logo .play { width:34px; height:24px; background:#f03; border-radius:6px; position:relative; }
  .logo .play::after { content:""; position:absolute; left:13px; top:6px;
    border-left:10px solid #fff; border-top:6px solid transparent; border-bottom:6px solid transparent; }
  .logo .two { background:#f03; color:#fff; font-size:13px; border-radius:5px; padding:1px 6px; }
  main { padding:20px; display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px; }
  .vid { text-decoration:none; color:inherit; }
  .thumb { aspect-ratio:16/9; border-radius:12px; background:linear-gradient(135deg,#1c1c2e,#2b2b4a);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .thumb .bigplay { width:64px; height:64px; border-radius:50%; background:rgba(0,0,0,.65);
    display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; }
  .thumb .dur { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.8);
    font-size:12px; padding:2px 6px; border-radius:4px; }
  .vid h3 { font-size:15px; margin:10px 0 4px; }
  .vid p { font-size:13px; color:#aaa; }
  .vid:hover .thumb .bigplay { background:#f03; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="play"></span>YouTube <span class="two">2</span></div>
</header>
<main>
  <a class="vid" href="player.html?vid=oobe.mp3">
    <div class="thumb"><div class="bigplay">▶</div><span class="dur">audio</span></div>
    <h3>OOBE</h3>
    <p>YouTube 2 · audio</p>
  </a>
</main>
</body>
</html>
